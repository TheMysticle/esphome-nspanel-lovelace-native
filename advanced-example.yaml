# Advanced configuration example
# This includes some commented out configuration items showing what other functionality is available
# Available icons can be found in 'components\nspanel_lovelace\icons.json'. Icon colors range from 0 to 65535.

# NOTE: This project is in the beta stage so the configuration is subject to change without notice.
#       Please check your own configuration againist the latest example when updating.

esphome:
  name: nspanel
  name_add_mac_suffix: true
  comment: "ESPHome Advanced NSPanel Example"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/TheMysticle/esphome-nspanel-lovelace-native
      ref: dev
    refresh: 1h
    components: [nspanel_lovelace]

nspanel_lovelace:
  id: nspanel_comp
  screensaver:
    double_tap_to_unlock: true
    time_id: homeassistant_time
    weather:
      entity_id: weather.openweathermap
      forecast_method: service
  cards:
    - type: cardGrid
      title: "Home Dashboard"
      entities:
        - entity_id: light.master_bedroom
          name: "Bedroom"
        - entity_id: vacuum.robot_cleaner
          name: "Vacuum"
        - entity_id: script.movie_mode
          name: "Movie Mode"
          icon: "movie"

    - type: cardThermo
      title: "Climate Control"
      thermo_entity_id: climate.main_thermostat

    - type: cardQR
      title: "Guest WiFi"
      qr_text: "WIFI:S:MyNetwork;P:MyPassword;;"

# --- HEATING SYNC (Tracks hvac_action attribute) ---
text_sensor:
  - platform: homeassistant
    entity_id: climate.main_thermostat
    attribute: hvac_action
    on_value:
      then:
        - lambda: 'id(nspanel_comp).send_display_command(x == "heating" ? "bt1Val~1" : "bt1Val~0");'

# --- LIGHT & RELAY SYNC ---
binary_sensor:
  - platform: homeassistant
    entity_id: switch.nspanel_relay_1
    id: lr_sync
    on_state:
      then:
        - lambda: 'id(nspanel_comp).send_display_command(id(lr_sync).state ? "bt0Val~1" : "bt0Val~0");'

  - platform: homeassistant
    entity_id: switch.nspanel_relay_2
    id: kit_sync
    on_state:
      then:
        - lambda: 'id(nspanel_comp).send_display_command(id(kit_sync).state ? "bt2Val~1" : "bt2Val~0");'
        
  # Physical Button Multi-Click logic
  - platform: gpio
    pin: {number: 14, inverted: true}
    on_multi_click:
      - timing: # Short Click: Toggle Relay
          - state: true
            max_length: 350ms
        then:
          - switch.toggle: relay_1
      - timing: # Long Press: Toggle AC
          - state: true
            min_length: 1500ms
        then:
          - homeassistant.service:
              service: homeassistant.toggle
              data: {entity_id: climate.ac_unit}

# --- INDOOR TEMP SYNC ---
sensor:
  - platform: homeassistant
    entity_id: sensor.room_temperature # Your HA temperature sensor
    on_value:
      then:
        - lambda: |-
            char buf[16];
            sprintf(buf, "%.1f°C", x); 
            id(nspanel_comp).send_display_command("indoorTemp~" + std::string(buf));

  # Hardware NTC Sensor logic
  - platform: adc
    id: ntc_source
    pin: 38
    update_interval: 60s
    attenuation: 11db
  - platform: resistance
    id: resistance_sensor
    sensor: ntc_source
    configuration: DOWNSTREAM
    resistor: 11.2kOhm
  - platform: ntc
    id: internal_temp
    sensor: resistance_sensor
    calibration:
      b_constant: 3950
      reference_temperature: 25°C
      reference_resistance: 10kOhm
    name: "Internal Case Temperature"

# --- BRIGHTNESS CONTROL SLIDERS ---
number:
  - platform: template
    name: "Active Brightness"
    min_value: 10
    max_value: 100
    initial_value: 100
    on_value:
      then:
        - lambda: 'id(nspanel_comp).set_display_active_dim(x);'
  - platform: template
    name: "Screensaver Brightness"
    min_value: 0
    max_value: 50
    initial_value: 20
    on_value:
      then:
        - lambda: 'id(nspanel_comp).set_display_inactive_dim(x);'

uart:
  id: uart_nextion
  tx_pin: 16
  rx_pin: 17
  baud_rate: 115200

logger:
  baud_rate: 0 

time:
  - platform: homeassistant
    id: homeassistant_time

switch:
  - platform: gpio
    name: "Left Relay"
    id: relay_1
    pin: 19
  - platform: gpio
    name: "Right Relay"
    id: relay_2
    pin: 22
  - platform: gpio
    name: "Screen Power"
    id: screen_power
    pin: {number: 4, inverted: true}
    restore_mode: ALWAYS_ON

output:
  - platform: ledc
    id: buzzer_out
    pin: 21

rtttl:
  id: buzzer
  output: buzzer_out

api:
  services:
    - service: upload_tft
      variables:
        url: string
      then:
        - lambda: 'id(nspanel_comp).upload_tft(url);'