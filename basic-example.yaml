esphome:
  name: nspanel-basic
  friendly_name: NSPanel Basic

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/TheMysticle/esphome-nspanel-lovelace-native
      ref: dev
    refresh: 1h
    components: [nspanel_lovelace]

nspanel_lovelace:
  id: nspanel_comp
  screensaver:
    double_tap_to_unlock: true
    time_id: homeassistant_time
    weather:
      entity_id: weather.home_weather # Change to your weather entity
      forecast_method: service
  cards:
    - type: cardGrid
      title: "Main Controls"
      entities:
        - entity_id: light.living_room
          name: "Living Room"
        - entity_id: switch.kitchen_light
          name: "Kitchen"

# --- SYNC LOGIC for Screensaver Buttons ---
binary_sensor:
  # Sync bt0 with Left Relay
  - platform: homeassistant
    entity_id: switch.nspanel_relay_1
    id: relay_1_sync
    on_state:
      then:
        - lambda: 'id(nspanel_comp).send_display_command(id(relay_1_sync).state ? "bt0Val~1" : "bt0Val~0");'

  # Sync bt2 with Right Relay
  - platform: homeassistant
    entity_id: switch.nspanel_relay_2
    id: relay_2_sync
    on_state:
      then:
        - lambda: 'id(nspanel_comp).send_display_command(id(relay_2_sync).state ? "bt2Val~1" : "bt2Val~0");'

  # Physical buttons below screen
  - platform: gpio
    pin: {number: 14, inverted: true}
    on_click:
      - switch.toggle: relay_1
  - platform: gpio
    pin: {number: 27, inverted: true}
    on_click:
      - switch.toggle: relay_2

uart:
  id: uart_nextion
  tx_pin: 16
  rx_pin: 17
  baud_rate: 115200

logger:
  baud_rate: 0 

time:
  - platform: homeassistant
    id: homeassistant_time

switch:
  - platform: gpio
    name: "Relay 1"
    id: relay_1
    pin: 19
  - platform: gpio
    name: "Relay 2"
    id: relay_2
    pin: 22
  - platform: gpio
    name: "Screen Power"
    pin: {number: 4, inverted: true}
    restore_mode: ALWAYS_ON

api:
  services:
    - service: upload_tft
      variables:
        url: string
      then:
        - lambda: 'id(nspanel_comp).upload_tft(url);'

ota:
  - platform: esphome